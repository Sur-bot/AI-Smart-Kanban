<header class="tasks-toolbar">
    <nav class="toolbar-left" aria-label="Toolbar Primary">
        <h1 class="toolbar-title m-0 text-base font-normal">{{ title }}</h1>
        <div class="btn-create-group" role="group" aria-label="Create Actions">
            <button class="btn-create-main" type="button" (click)="openCreateModal(); $event.stopPropagation()">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5"
                    stroke="currentColor" class="w-4 h-4">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
                </svg>
                <span>Tạo</span>
            </button>
            <div class="btn-create-divider" *ngIf="showCreateDropdown"></div>
            <button class="btn-create-dropdown" *ngIf="showCreateDropdown">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5"
                    stroke="currentColor" class="w-3.5 h-3.5 opacity-80">
                    <path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5" />
                </svg>
            </button>
        </div>
        <div class="relative" *ngIf="showRoleDropdown">
            <button class="btn-role" (click)="toggleRoleDropdown($event)" [class.active]="isRoleDropdownOpen">
                <span>{{ getSelectedRoleLabel() }}</span>
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5"
                    stroke="currentColor" class="w-3.5 h-3.5 ml-1 opacity-60 transition-transform duration-200"
                    [class.rotate-180]="isRoleDropdownOpen">
                    <path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5" />
                </svg>
            </button>

            <menu class="role-dropdown-menu m-0 p-0" *ngIf="isRoleDropdownOpen" (click)="$event.stopPropagation()">
                <div class="role-dropdown-item" *ngFor="let role of roles"
                    (click)="selectRole(role.id)">
                    <span [class.text-gray-900]="selectedRole === role.id">{{ role.label }}</span>
                    <svg *ngIf="selectedRole === role.id" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                        stroke-width="2" stroke="currentColor" class="w-4 h-4 text-blue-500 shrink-0">
                        <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5" />
                    </svg>
                </div>
            </menu>
        </div>
        <form class="search-filter-container" role="search" [class.expanded]="isSearchOpen && !isSearchClosing" (submit)="$event.preventDefault()">
            <div class="search-input-box" [class.has-filter]="!!selectedSearchFilter || selectedRole !== 'all'" [class.has-role-filter]="selectedRole !== 'all'" (click)="toggleSearch($event)">
                <div class="flex items-center gap-1 shrink-0" *ngIf="selectedSearchFilter || selectedRole !== 'all'">
                    <div class="search-active-tag" *ngIf="selectedSearchFilter">
                        {{ getSelectedSearchFilterLabel() }}
                        <button class="tag-remove" (click)="$event.stopPropagation(); clearSearchFilter()">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-3.5 h-3.5">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
                            </svg>
                        </button>
                    </div>
                    <div class="search-active-tag" *ngIf="selectedRole !== 'all'">
                        Vai trò: {{ getSelectedRoleLabel() }}
                        <button class="tag-remove" (click)="$event.stopPropagation(); clearRoleFilter()">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-3.5 h-3.5">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
                            </svg>
                        </button>
                    </div>
                </div>
                <input type="text" [placeholder]="(selectedSearchFilter || selectedRole !== 'all') ? 'Tìm kiếm' : 'Lọc và tìm kiếm'" class="search-real-input" [value]="searchQuery" (input)="onSearchInput($event)">

                <div class="search-icons">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4 text-white/50">
                        <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" />
                    </svg>
                    <svg *ngIf="searchQuery || selectedSearchFilter || selectedRole !== 'all'" (click)="$event.stopPropagation(); clearSearch()" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4 ml-1 opacity-50 cursor-pointer hover:opacity-100 text-white">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
                    </svg>
                </div>
            </div>

            <section class="search-popup-panel" aria-label="Search Filters" *ngIf="isSearchOpen || isSearchClosing" [class.closing]="isSearchClosing" [ngStyle]="popupStyle" (click)="onPanelClick($event)">
                <aside class="search-popup-sidebar" aria-label="Preset filters">
                    <div class="search-preset-item" *ngFor="let filter of searchFilters"
                        [class.active]="selectedSearchFilter === filter.id"
                        (click)="selectSearchFilter(filter.id)">
                        <span>{{ filter.label }}</span>
                        <svg *ngIf="selectedSearchFilter === filter.id" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="w-3.5 h-3.5 transform rotate-45 text-blue-500 ml-auto opacity-70">
                            <path d="M12.232 4.232a2.5 2.5 0 0 1 3.536 3.536l-1.225 1.224a.75.75 0 0 0 1.061 1.06l1.224-1.224a4 4 0 0 0-5.656-5.656l-3 3a4 4 0 0 0 .225 5.865.75.75 0 0 0 .977-1.138 2.5 2.5 0 0 1-.142-3.667l3-3Z" />
                            <path d="M11.603 7.963a.75.75 0 0 0-.977 1.138 2.5 2.5 0 0 1 .142 3.667l-3 3a2.5 2.5 0 0 1-3.536-3.536l1.225-1.224a.75.75 0 0 0-1.061-1.06l-1.224 1.224a4 4 0 1 0 5.656 5.656l3-3a4 4 0 0 0-.225-5.865Z" />
                        </svg>
                    </div>
                </aside>
                <main class="search-popup-content !p-0">
                    <div class="flex-1 overflow-y-auto p-6 pb-4 min-h-0 custom-scrollbar">
                        <ng-container *ngFor="let field of availableFields; let first = first">
                            <fieldset class="filter-group m-0 p-0 border-none" [class.mt-5]="!first" *ngIf="field.checked">
                                <label [for]="field.id">{{ field.label }}</label>
                                
                                <div class="flex items-center gap-3">
                                    <div class="flex-1 min-w-0" [ngSwitch]="field.type">
                                        <input *ngSwitchCase="'text'" type="text" [id]="field.id" class="form-input-box" [placeholder]="'Nhập ' + field.label.toLowerCase()" />

                                        <input *ngSwitchCase="'date'" type="date" [id]="field.id" class="form-input-box" />

                                        <button type="button" *ngSwitchCase="'select'" [id]="field.id" class="role-select-box w-full text-left">
                                            <span class="truncate">Không quy định</span>
                                            <mat-icon class="text-gray-400 !text-[18px] shrink-0">expand_more</mat-icon>
                                        </button>

                                        <div *ngSwitchCase="'tags'" [id]="field.id" class="status-tags-box" role="group" aria-label="Tags">
                                            <span class="status-tag" *ngFor="let st of field.options">
                                                {{ st }}
                                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-3 h-3 ml-1.5 opacity-40 hover:opacity-100 cursor-pointer transition-opacity">
                                                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
                                                </svg>
                                            </span>
                                            <div class="status-dropdown-icon ml-auto">
                                                <mat-icon class="text-gray-400 !text-[18px]">expand_more</mat-icon>
                                            </div>
                                        </div>
                                    </div>
                                    <button type="button" class="flex items-center justify-center text-gray-500 opacity-40 hover:opacity-100 transition-opacity shrink-0" (click)="toggleFieldCheck(field.id)" title="Xóa trường này">
                                        <mat-icon class="!text-[18px] !w-[18px] !h-[18px] !leading-[18px] flex items-center justify-center">close</mat-icon>
                                    </button>
                                </div>
                            </fieldset>
                        </ng-container>

                        <div class="flex items-center gap-4 text-[13px] relative" [class.mt-5]="hasCheckedFields()">
                            <button type="button" class="text-blue-500 font-medium hover:underline bg-transparent border-none p-0 cursor-pointer" (click)="toggleAddField($event)">Thêm trường</button>
                            <button type="button" class="text-gray-400 hover:text-gray-600 transition-colors bg-transparent border-none p-0 cursor-pointer" (click)="restoreDefaultFields()">Khôi phục các trường mặc định</button>
                        </div>
                    </div>

                    <div class="shrink-0 p-6 pt-4 bg-white rounded-br-xl relative z-10">

                        <div class="search-popup-actions flex items-center justify-center gap-5">
                            <button class="btn-primary" (click)="closeSearch()">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4 mr-1.5"><path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" /></svg>
                                Tìm kiếm
                            </button>
                            <button type="button" class="text-gray-600 hover:text-gray-900 font-medium text-sm transition-colors bg-transparent border-none p-0 cursor-pointer">Đặt lại</button>
                        </div>
                    </div>
                </main>

                <aside class="add-field-popup" role="dialog" aria-label="Available Fields" *ngIf="isAddFieldOpen" [ngStyle]="addFieldPopupStyle" (click)="$event.stopPropagation()">
                    <div class="field-list">
                        <label class="field-item" *ngFor="let field of availableFields">
                            <input type="checkbox" class="field-checkbox" [checked]="field.checked" (change)="toggleFieldCheck(field.id)">
                            <span class="field-label">{{ field.label }}</span>
                        </label>
                    </div>
                </aside>
            </section>
        </form>
    </nav>
    <div class="toolbar-right" *ngIf="showToolbarRight">
        <button type="button" class="toolbar-icon-btn" title="CoPilot">
            <mat-icon fontSet="material-icons-outlined">auto_awesome</mat-icon>
        </button>
        <button type="button" class="toolbar-icon-btn" title="Chia sẻ">
            <mat-icon fontSet="material-icons-outlined">share</mat-icon>
        </button>
    </div>
</header>

<!-- Modal Tao Tac Vu nhanh -->
<app-create-task-modal
  [isOpen]="isCreateModalOpen"
  (close)="closeCreateModal()"
></app-create-task-modal>
