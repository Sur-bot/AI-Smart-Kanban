<div class="flex flex-col bg-[#F8FAFB] rounded-[16px] overflow-hidden w-[760px] max-w-full relative shadow-2xl font-sans">
  <!-- Header -->
  <div class="flex items-center justify-between px-3 py-2">
    <h2 class="text-[20px] font-semibold text-[#333] m-0">Chủ đề</h2>
    <button (click)="cancel()" class="text-gray-400 bg-transparent border-none cursor-pointer flex items-center justify-center p-1 rounded-full">
      <mat-icon class="!text-[20px] !w-[20px] !h-[20px]">close</mat-icon>
    </button>
  </div>

  <!-- Content (Grid) -->
  <div class="px-3 pb-3 overflow-y-auto max-h-[320px] no-scrollbar">
    <div class="bg-[#EEF2F6] p-3">
      <div class="grid grid-cols-4 gap-3">
        <div *ngFor="let theme of themes" 
             (click)="selectTheme(theme)"
             class="relative cursor-pointer rounded-[12px] overflow-hidden aspect-[4/3] group transition-shadow duration-200 hover:ring-2 hover:ring-[#2FC6F6]/80 hover:ring-offset-2 hover:ring-offset-[#EEF2F6]"
             [ngClass]="{'ring-2 ring-[#2FC6F6] ring-offset-2 ring-offset-[#EEF2F6]': selectedThemeUrl === theme.url}">
          
          <img [src]="theme.url" alt="Theme thumbnail" class="w-full h-full object-cover block" />
          
          <div *ngIf="theme.isDefault" class="absolute top-2 right-2 bg-[#2FC6F6]/80 backdrop-blur-sm text-white text-[12px] font-medium px-2.5 py-0.5 rounded-full shadow-sm z-20">
            Mặc định
          </div>

          <div *ngIf="theme.name" class="absolute inset-x-0 bottom-0 bg-black/40 backdrop-blur-[2px] py-1 px-2 translate-y-full group-hover:translate-y-0 transition-transform duration-200 ease-out z-20">
            <span class="text-white text-[13px] font-medium drop-shadow-md">{{ theme.name }}</span>
          </div>

        </div>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <div class="flex items-center px-3 py-4 bg-white relative z-10 shadow-[0_-4px_12px_rgba(0,0,0,0.06)]">
    
    <div class="flex-1 flex items-center gap-2 cursor-pointer text-[#535C69] hover:text-gray-800 transition-colors">
      <input type="checkbox" id="default-for-all" class="w-4 h-4 rounded border-gray-300 text-[#B2EA1B] focus:ring-[#B2EA1B] cursor-pointer" />
      <label for="default-for-all" class="text-[13px] font-normal cursor-pointer flex items-center gap-1 select-none">
        Chủ đề mặc định
        <mat-icon class="!text-[15px] !w-[15px] !h-[15px] text-[#2FC6F6]">lock</mat-icon>
      </label>
    </div>

    <!-- Center Buttons -->
    <div class="flex items-center justify-center gap-4">
      <button (click)="save()" class="bg-[#BCEE28] hover:bg-[#AFE122] text-[#333] font-semibold text-[13px] px-6 py-1.5 rounded-[4px] border-none cursor-pointer transition-colors shadow-sm">
        LƯU
      </button>
      <button (click)="cancel()" class="bg-transparent text-[#535C69] hover:text-gray-800 font-semibold text-[13px] px-2 py-1.5 border-none cursor-pointer transition-colors">
        HỦY BỎ
      </button>
    </div>

    <!-- Right link -->
    <div class="flex-1 flex justify-end">
      <button class="bg-transparent text-[#535C69] hover:text-gray-800 font-semibold text-[13px] border-none cursor-pointer transition-colors">
        CHỦ ĐỀ TÙY CHỈNH
      </button>
    </div>
  </div>
</div>
