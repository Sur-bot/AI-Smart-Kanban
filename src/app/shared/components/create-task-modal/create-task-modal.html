@if (isOpen) {
  <div class="modal-backdrop" role="presentation" (click)="onBackdropClick($event)">
    <dialog
      class="create-task-dialog"
      open
      role="dialog"
      aria-modal="true"
      aria-labelledby="create-task-title-input"
      (click)="onDialogContentClick($event)"
    >
      <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>

        <header class="dialog-header">
          <input
            id="create-task-title-input"
            formControlName="title"
            type="text"
            class="title-input"
            placeholder="Tên tác vụ"
            autocomplete="off"
            aria-label="Tên tác vụ"
            autofocus
          />
          <div class="header-actions">
            <button
              type="button"
              class="icon-btn fire-btn"
              [class.active]="isHighPriority"
              aria-label="Đánh dấu ưu tiên cao"
              (click)="toggleHighPriority()"
            >
              <mat-icon fontSet="material-icons-outlined" [class.text-orange-500]="isHighPriority">local_fire_department</mat-icon>
            </button>
            <button
              type="button"
              class="icon-btn close-btn"
              aria-label="Đóng"
              (click)="onClose()"
            >
              <mat-icon fontSet="material-icons-outlined">close</mat-icon>
            </button>
          </div>
        </header>

        <section class="dialog-body" aria-label="Thông tin tác vụ">

          <div class="field-row description-row">
            <textarea
              formControlName="description"
              class="description-input custom-scrollbar"
              placeholder="Mô tả"
              rows="2"
              aria-label="Mô tả tác vụ"
            ></textarea>
          </div>

          <div class="field-row relative">
            <label class="field-label" for="assignee-input">Người được phân công:</label>
            <div class="field-value">
              <div class="assignee-wrapper">
                <button
                  type="button"
                  class="assignee-badge"
                  (click)="toggleAssigneeDropdown($event)"
                  aria-label="Chọn người được phân công"
                >
                  <figure class="avatar-circle" aria-hidden="true">
                    <img *ngIf="assigneeAvatar" [src]="assigneeAvatar" [alt]="assigneeName" class="avatar-img" />
                    <mat-icon *ngIf="!assigneeAvatar" fontSet="material-icons-outlined" class="avatar-icon">account_circle</mat-icon>
                  </figure>
                  <span class="assignee-name">{{ assigneeName || 'Chọn người...' }}</span>
                </button>

                @if (isAssigneeDropdownOpen) {
                  <section class="assignee-popover" (click)="$event.stopPropagation()" role="dialog" aria-label="Chọn người được phân công">
                    <aside class="assignee-popover-sidebar">
                      <button type="button" class="sidebar-icon-btn active" aria-label="Tìm kiếm">
                        <mat-icon fontSet="material-icons-outlined">search</mat-icon>
                      </button>
                      <button type="button" class="sidebar-icon-btn" aria-label="Danh sách thành viên">
                        <mat-icon fontSet="material-icons-outlined">people</mat-icon>
                      </button>
                    </aside>

                    <div class="assignee-popover-main">
                      <div class="assignee-search-container">
                        <div class="selected-member-tag" *ngIf="assigneeName">
                          <figure class="tag-avatar">
                            <mat-icon fontSet="material-icons-outlined">account_circle</mat-icon>
                          </figure>
                          <span class="tag-name">{{ assigneeName }}</span>
                          <button type="button" class="tag-close-btn" (click)="clearAssignee($event)" aria-label="Bỏ chọn">
                            <mat-icon fontSet="material-icons-outlined">close</mat-icon>
                          </button>
                        </div>
                        <input
                          type="text"
                          [(ngModel)]="searchMemberQuery"
                          [ngModelOptions]="{standalone: true}"
                          class="member-search-input"
                          placeholder="tìm kiếm"
                          aria-label="Tìm kiếm người dùng"
                        />
                      </div>

                      <div class="members-list custom-scrollbar">
                        <button
                          type="button"
                          class="member-item selected"
                          (click)="selectMember(assigneeName || 'Văn Anh Nguyễn', assigneeId || 'current-user', $event)"
                        >
                          <figure class="avatar-circle" aria-hidden="true">
                            <img *ngIf="assigneeAvatar" [src]="assigneeAvatar" [alt]="assigneeName" class="avatar-img" />
                            <mat-icon *ngIf="!assigneeAvatar" fontSet="material-icons-outlined" class="avatar-icon">account_circle</mat-icon>
                          </figure>
                          <span class="member-name">{{ assigneeName || 'Văn Anh Nguyễn' }}</span>
                          <mat-icon fontSet="material-icons-outlined" class="check-icon">check</mat-icon>
                        </button>
                      </div>

                      <footer class="assignee-popover-footer">
                        <button type="button" class="btn-add-circle" aria-label="Mời thêm">
                          <mat-icon fontSet="material-icons-outlined">add</mat-icon>
                        </button>
                        <span class="footer-invite-text">
                          <span class="invite-link">Mời một người dùng</span> hoặc <span class="invite-link">mời một khách</span>
                          <mat-icon fontSet="material-icons-outlined" class="lock-icon">lock</mat-icon>
                        </span>
                      </footer>
                    </div>
                  </section>
                }
              </div>
            </div>
          </div>

          <div class="field-row relative">
            <label class="field-label">Hạn chót:</label>
            <div class="field-value">
              <app-due-date-picker
                [value]="form.get('dueDate')?.value"
                emptyVariant="badge"
                emptyTextKey="DUE_DATE_PICKER.NO_DUE_DATE"
                [showTuneBtn]="true"
                (valueChange)="onDueDateChange($event)">
              </app-due-date-picker>
            </div>
          </div>

        </section>

        <hr class="dialog-divider" />

        <section class="dialog-chips" aria-label="Tùy chọn bổ sung">
          <button type="button" class="chip-btn" aria-label="Đính kèm tập tin">
            <mat-icon fontSet="material-icons-outlined" class="chip-icon">attach_file</mat-icon>
            <span>Tập tin</span>
          </button>
          <button type="button" class="chip-btn" aria-label="Thêm danh sách kiểm tra">
            <mat-icon fontSet="material-icons-outlined" class="chip-icon">checklist</mat-icon>
            <span>Danh sách kiểm tra</span>
          </button>
          <button type="button" class="chip-btn" aria-label="Chọn dự án">
            <mat-icon fontSet="material-icons-outlined" class="chip-icon">folder_open</mat-icon>
            <span>Dự án</span>
          </button>
        </section>

        <footer class="dialog-footer">
          <div class="footer-actions">
            <button
              type="submit"
              class="btn-submit"
              [disabled]="form.invalid || isSubmitting"
              aria-label="Tạo tác vụ"
            >
              {{ isSubmitting ? 'Đang tạo...' : 'Tạo' }}
            </button>
            <button
              type="button"
              class="btn-cancel"
              (click)="onClose()"
              aria-label="Hủy bỏ"
            >
              Hủy
            </button>
          </div>
          <button
            type="button"
            class="btn-detail-link"
            (click)="onDetailClick($event)"
            aria-label="Mở biểu mẫu chi tiết"
          >
            Biểu mẫu chi tiết
          </button>
        </footer>

      </form>
    </dialog>
  </div>
}
