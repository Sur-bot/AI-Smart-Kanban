@if (isOpen) {
  <div class="modal-backdrop" role="presentation" (click)="onBackdropClick($event)">
    <dialog
      class="create-task-dialog"
      open
      role="dialog"
      aria-modal="true"
      aria-labelledby="create-task-title"
      (click)="$event.stopPropagation()"
    >
      <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>

        <!-- ── Header ─────────────────────────────── -->
        <header class="dialog-header">
          <input
            id="create-task-title-input"
            formControlName="title"
            type="text"
            class="title-input"
            placeholder="Tên tác vụ"
            autocomplete="off"
            aria-label="Tên tác vụ"
            autofocus
          />
          <div class="header-actions">
            <button
              type="button"
              class="icon-btn fire-btn"
              [class.active]="isHighPriority"
              title="Ưu tiên cao"
              aria-label="Đánh dấu ưu tiên cao"
              (click)="toggleHighPriority()"
            >
              <mat-icon fontSet="material-icons-outlined" [class.text-orange-500]="isHighPriority">local_fire_department</mat-icon>
            </button>
            <button
              type="button"
              class="icon-btn close-btn"
              title="Đóng"
              aria-label="Đóng"
              (click)="onClose()"
            >
              <mat-icon fontSet="material-icons-outlined">close</mat-icon>
            </button>
          </div>
        </header>

        <!-- ── Body ──────────────────────────────── -->
        <section class="dialog-body" aria-label="Thông tin tác vụ">

          <!-- Mô tả -->
          <div class="field-row description-row">
            <textarea
              formControlName="description"
              class="description-input custom-scrollbar"
              placeholder="Mô tả"
              rows="2"
              aria-label="Mô tả tác vụ"
            ></textarea>
          </div>

          <!-- Người được phân công -->
          <div class="field-row">
            <label class="field-label" for="assignee-input">Người được phân công:</label>
            <div class="field-value">
              <div class="assignee-display">
                <figure class="avatar-circle" aria-hidden="true">
                  <img *ngIf="assigneeAvatar" [src]="assigneeAvatar" [alt]="assigneeName" class="avatar-img" />
                  <mat-icon *ngIf="!assigneeAvatar" fontSet="material-icons-outlined" class="avatar-icon">account_circle</mat-icon>
                </figure>
                <span class="assignee-name">{{ assigneeName }}</span>
              </div>
            </div>
          </div>

          <!-- Hạn chót -->
          <div class="field-row relative">
            <label class="field-label">Hạn chót:</label>
            <div class="field-value">
              <button
                type="button"
                class="due-date-badge"
                [class.has-date]="!!selectedDate"
                (click)="toggleDatePicker($event)"
                aria-label="Chọn hạn chót"
              >
                <mat-icon fontSet="material-icons-outlined" class="calendar-icon">calendar_today</mat-icon>
                <span class="due-date-text">{{ formattedDueDate }}</span>
              </button>

              <!-- ── DatePicker Popover 2 Cột (Ảnh 3) ── -->
              @if (isDatePickerOpen) {
                <section class="datepicker-popover" (click)="$event.stopPropagation()" role="dialog" aria-label="Chọn ngày hạn chót">
                  <!-- Cột trái: Lịch tháng -->
                  <div class="calendar-pane">
                    <header class="calendar-nav">
                      <button type="button" class="nav-btn" (click)="prevMonth($event)" aria-label="Tháng trước">
                        <mat-icon fontSet="material-icons-outlined">chevron_left</mat-icon>
                      </button>
                      <span class="month-title">tháng {{ viewDate.getMonth() + 1 }} &nbsp;{{ viewDate.getFullYear() }}</span>
                      <button type="button" class="nav-btn" (click)="nextMonth($event)" aria-label="Tháng sau">
                        <mat-icon fontSet="material-icons-outlined">chevron_right</mat-icon>
                      </button>
                    </header>

                    <div class="weekdays-grid">
                      <span>T2</span>
                      <span>T3</span>
                      <span>T4</span>
                      <span>T5</span>
                      <span>T6</span>
                      <span class="text-rose-500">T7</span>
                      <span class="text-rose-500">CN</span>
                    </div>

                    <div class="days-grid">
                      @for (day of calendarDays; track $index) {
                        <button
                          type="button"
                          class="day-cell"
                          [class.other-month]="!day.isCurrentMonth"
                          [class.weekend]="day.isWeekend && day.isCurrentMonth"
                          [class.selected]="day.isSelected"
                          [class.today]="day.isToday && !day.isSelected"
                          (click)="selectCalendarDay(day, $event)"
                        >
                          {{ day.dayNumber }}
                        </button>
                      }
                    </div>

                    <footer class="time-picker-row">
                      <mat-icon fontSet="material-icons-outlined" class="time-icon">schedule</mat-icon>
                      <input
                        type="time"
                        [value]="selectedTime"
                        (change)="onTimeChange($event)"
                        class="time-input"
                        aria-label="Chọn giờ"
                      />
                      <span class="time-display">{{ formattedTimeDisplay }}</span>
                    </footer>
                  </div>

                  <!-- Cột phải: 5 Presets nhanh -->
                  <aside class="presets-pane">
                    @for (preset of datePresets; track preset.id) {
                      <button
                        type="button"
                        class="preset-card"
                        (click)="selectPreset(preset, $event)"
                      >
                        <strong class="preset-title">{{ preset.title }}</strong>
                        <small class="preset-subtitle">{{ preset.subtitle }}</small>
                      </button>
                    }
                  </aside>
                </section>
              }
            </div>
          </div>

        </section>

        <!-- Đường kẻ phân cách -->
        <hr class="dialog-divider" />

        <!-- ── Action Chips ───────────────────────── -->
        <section class="dialog-chips" aria-label="Tùy chọn bổ sung">
          <button type="button" class="chip-btn" title="Tập tin" aria-label="Đính kèm tập tin">
            <mat-icon fontSet="material-icons-outlined" class="chip-icon">attach_file</mat-icon>
            <span>Tập tin</span>
          </button>
          <button type="button" class="chip-btn" title="Danh sách kiểm tra" aria-label="Thêm danh sách kiểm tra">
            <mat-icon fontSet="material-icons-outlined" class="chip-icon">checklist</mat-icon>
            <span>Danh sách kiểm tra</span>
          </button>
          <button type="button" class="chip-btn" title="Dự án" aria-label="Chọn dự án">
            <mat-icon fontSet="material-icons-outlined" class="chip-icon">folder_open</mat-icon>
            <span>Dự án</span>
          </button>
        </section>

        <!-- ── Footer ─────────────────────────────── -->
        <footer class="dialog-footer">
          <div class="footer-actions">
            <button
              type="submit"
              class="btn-submit"
              [disabled]="form.invalid || isSubmitting"
              aria-label="Tạo tác vụ"
            >
              {{ isSubmitting ? 'Đang tạo...' : 'Tạo' }}
            </button>
            <button
              type="button"
              class="btn-cancel"
              (click)="onClose()"
              aria-label="Hủy bỏ"
            >
              Hủy
            </button>
          </div>
          <button
            type="button"
            class="btn-detail-link"
            (click)="onDetailClick($event)"
            aria-label="Mở biểu mẫu chi tiết"
          >
            Biểu mẫu chi tiết
          </button>
        </footer>

      </form>
    </dialog>
  </div>
}
