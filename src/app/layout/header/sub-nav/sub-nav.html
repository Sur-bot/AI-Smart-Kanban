<nav class="flex items-center h-full bg-transparent overflow-x-auto select-none">
  <ul class="flex items-center gap-0.5 text-[15px] font-medium whitespace-nowrap">

    <li *ngFor="let item of menuList" class="relative">

      <!-- Link thông thường -->
      <a *ngIf="!item.hasDropdown" [routerLink]="item.route"
        routerLinkActive="!text-white !bg-white/15 font-semibold"
        [routerLinkActiveOptions]="{exact: true}"
        class="relative px-3 py-1.5 rounded-md text-white/65 hover:text-white hover:bg-white/10 transition-all duration-150 flex items-center gap-1">
        {{ item.label | translate }}

        <span *ngIf="item.badge"
          class="absolute -top-1 left-1/2 -translate-x-1/2 text-[9px] font-bold text-emerald-300 bg-emerald-500/20 px-1 rounded-full leading-tight">
          {{ item.badge }}
        </span>
      </a>

      <!-- Button có dropdown -->
      <button *ngIf="item.hasDropdown" (click)="openMenu(item.id)"
        class="flex items-center gap-1 px-3 py-1.5 rounded-md text-white/65 hover:text-white hover:bg-white/10 transition-all duration-150 cursor-pointer">
        <span>{{ item.label | translate }}</span>
        <svg class="w-3 h-3 opacity-50 mt-px" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5" />
        </svg>
      </button>

    </li>
  </ul>
</nav>
