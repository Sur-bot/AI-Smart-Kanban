<div class="header-wrapper">
  <div class="header-container">

    <!-- ===== LEFT: Sub Navigation ===== -->
    <div class="header-left">
      <app-sub-nav class="block flex-1 min-w-0"></app-sub-nav>
    </div>

    <!-- ===== RIGHT: Actions & Widgets ===== -->
    <div class="header-right">

      <!-- Search -->
      <div class="search-wrapper hidden sm:flex items-center">
        <app-expandable-search></app-expandable-search>
      </div>

      <div class="hidden xl:flex items-center leading-none select-none shrink-0">
        <span class="logo-text">Digit</span>
        <span class="logo-number">24</span>
      </div>

      <!-- Settings Popup -->
      <div class="setting-wrapper">
        <button id="header-settings-btn" class="header-icon-btn" (click)="togglePopup()" [title]="'HEADER.SETTINGS' | translate"
          [class.bg-white/10]="isPopupOpen" [class.text-white]="isPopupOpen">
          <!-- Sliders icon -->
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round">
            <circle cx="16" cy="8" r="2.5" />
            <path d="M3 8h10.5M18.5 8H21" />
            <circle cx="8" cy="16" r="2.5" />
            <path d="M3 16h2.5M10.5 16H21" />
          </svg>
        </button>

        <app-setting-slider [isOpen]="isPopupOpen" (close)="activePopup = null"></app-setting-slider>
      </div>

      <!-- Action Buttons Group -->
      <div class="hidden sm:flex items-center gap-1.5">

        <!-- Invite / Mời -->
        <div class="invite-wrapper">
          <button id="header-invite-btn" class="header-action-btn accent" (click)="toggleInvite()" [title]="'HEADER.INVITE' | translate">
            <mat-icon fontSet="material-icons-outlined" class="!text-[15px] !w-[15px] !h-[15px] xl:mr-1 shrink-0">person_add</mat-icon>
            <span class="hidden xl:inline">{{ 'HEADER.INVITE' | translate }}</span>
          </button>

          <app-invite-dropdown [isOpen]="isInviteOpen" (close)="activePopup = null"></app-invite-dropdown>
        </div>

        <!-- Buy Now / Mua ngay -->
        <button id="header-buy-btn" class="header-action-btn primary" [title]="'HEADER.UPGRADE' | translate">
          <mat-icon fontSet="material-icons-outlined" class="!text-[15px] !w-[15px] !h-[15px] xl:mr-1 shrink-0">bolt</mat-icon>
          <span class="hidden xl:inline">{{ 'HEADER.UPGRADE' | translate }}</span>
        </button>

        <!-- Help / Trợ giúp -->
        <button id="header-help-btn" class="header-action-btn ghost" [title]="'HEADER.HELP_TITLE' | translate">
          <mat-icon fontSet="material-icons-outlined" class="!text-[15px] !w-[15px] !h-[15px] xl:mr-1 shrink-0">help_outline</mat-icon>
          <span class="hidden xl:inline">{{ 'HEADER.HELP' | translate }}</span>
        </button>
      </div>

      <!-- User Profile & Time Widget -->
      <div class="user-profile-wrapper relative">
        <app-user-time-widget
          id="header-user-widget-btn"
          [isOpen]="isProfileOpen"
          (click)="toggleProfile()"
        ></app-user-time-widget>

        <app-user-profile-dropdown
          [isOpen]="isProfileOpen"
          (close)="activePopup = null"
        ></app-user-profile-dropdown>
      </div>

    </div>
  </div>
</div>
