<div class="header-wrapper">
  <div class="header-container">

    <!-- ===== LEFT: Sub Navigation ===== -->
    <div class="header-left">
      <app-sub-nav class="block flex-1 min-w-0"></app-sub-nav>
    </div>

    <!-- ===== RIGHT: Actions & Widgets ===== -->
    <div class="header-right">

      <!-- Search -->
      <div class="search-wrapper">
        <app-expandable-search></app-expandable-search>
      </div>

      <div class="flex items-center leading-none select-none">
        <span class="logo-text">Digit</span>
        <span class="logo-number">24</span>
      </div>

      <!-- Settings Popup -->
      <div class="setting-wrapper">
        <button id="header-settings-btn" class="header-icon-btn" (click)="togglePopup()" [title]="'HEADER.SETTINGS' | translate"
          [class.bg-white/10]="isPopupOpen" [class.text-white]="isPopupOpen">
          <!-- Sliders icon -->
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round">
            <circle cx="16" cy="8" r="2.5" />
            <path d="M3 8h10.5M18.5 8H21" />
            <circle cx="8" cy="16" r="2.5" />
            <path d="M3 16h2.5M10.5 16H21" />
          </svg>
        </button>

        <app-setting-slider [isOpen]="isPopupOpen" (close)="activePopup = null"></app-setting-slider>
      </div>

      <!-- Action Buttons Group -->
      <div class="flex items-center gap-1.5">

        <!-- Invite / Mời -->
        <div class="invite-wrapper">
          <button id="header-invite-btn" class="header-action-btn accent" (click)="toggleInvite()">
            <svg class="w-3 h-3 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
              <circle cx="9" cy="7" r="4" />
              <line x1="19" y1="8" x2="19" y2="14" />
              <line x1="22" y1="11" x2="16" y2="11" />
            </svg>
            {{ 'HEADER.INVITE' | translate }}
          </button>

          <app-invite-dropdown [isOpen]="isInviteOpen" (close)="activePopup = null"></app-invite-dropdown>
        </div>

        <!-- Buy Now / Mua ngay -->
        <button id="header-buy-btn" class="header-action-btn primary">
          <svg class="w-3 h-3 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round">
            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" />
          </svg>
          {{ 'HEADER.UPGRADE' | translate }}
        </button>

        <!-- Help / Trợ giúp -->
        <button id="header-help-btn" class="header-action-btn ghost" [title]="'HEADER.HELP_TITLE' | translate">
          <svg class="w-3 h-3 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10" />
            <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3" />
            <line x1="12" y1="17" x2="12.01" y2="17" />
          </svg>
          {{ 'HEADER.HELP' | translate }}
        </button>
      </div>

      <!-- User Time Widget -->
      <app-user-time-widget></app-user-time-widget>

    </div>
  </div>
</div>
