<div class="setting-slider-container">
  <ng-container *ngIf="isOpen">
    <!-- Arrow indicator -->
    <div class="setting-slider-arrow"></div>

    <!-- Dropdown panel -->
    <div @fadeInOut class="setting-slider-dropdown">

      <div class="setting-slider-header">
        <div class="setting-slider-header-content">
          <span class="domain-name">b24-efr2se.bitrix24.vn</span>
          <button class="edit-btn" [title]="'SETTINGS.EDIT_DOMAIN' | translate">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path
                d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>
        </div>
      </div>

      <div class="setting-slider-body">

        <div class="setting-card group">
          <div class="setting-card-left">
            <div class="icon-company">
              <i class="fa-solid fa-address-card"></i>
            </div>
            <span class="setting-card-title">{{ 'SETTINGS.COMPANY_DETAILS' | translate }}</span>
          </div>
          <button class="setting-card-action-btn">{{ 'SETTINGS.EDIT_COMPANY_DETAILS' | translate }}</button>
        </div>

        <div class="setting-card">
          <div class="setting-card-left">
            <div class="icon-home">
              <i class="fa-solid fa-house"></i>
            </div>
            <span class="setting-card-title">{{ 'SETTINGS.START_PAGE' | translate }}</span>
          </div>
          <i class="fa-solid fa-chevron-right setting-card-arrow"></i>
        </div>

        <div class="setting-grid">
          <div class="setting-card">
            <div class="setting-card-left icon-security">
              <i class="fa-solid fa-shield-halved"></i>
              <span class="setting-card-title">{{ 'SETTINGS.SECURITY' | translate }}</span>
            </div>
            <i class="fa-solid fa-chevron-right setting-card-arrow small"></i>
          </div>
          <div class="setting-card">
            <div class="setting-card-left icon-config">
              <i class="fa-solid fa-gear"></i>
              <span class="setting-card-title">{{ 'SETTINGS.SETTINGS' | translate }}</span>
            </div>
            <i class="fa-solid fa-chevron-right setting-card-arrow small"></i>
          </div>
        </div>

        <div class="setting-card">
          <div class="setting-card-left">
            <div class="icon-network">
              <i class="fa-solid fa-circle-nodes main"></i>
              <i class="fa-solid fa-lock lock"></i>
            </div>
            <span class="setting-card-title">{{ 'SETTINGS.BRANCH_NETWORK' | translate }}</span>
          </div>
          <button class="setting-card-action-btn">{{ 'SETTINGS.EDIT' | translate }}</button>
        </div>

        <div class="setting-footer">
          <button class="setting-footer-link">{{ 'SETTINGS.DEPLOYMENT_REQUEST' | translate }}</button>
          <button class="setting-footer-link">{{ 'SETTINGS.QUICK_START' | translate }}</button>
          <button class="setting-footer-link">{{ 'SETTINGS.SUPPORT' | translate }}</button>
        </div>

      </div>
    </div>
  </ng-container>
</div>
