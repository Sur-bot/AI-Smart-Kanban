<div class="project-switcher" [class.is-open]="isOpen" [class.collapsed]="isCollapsed">
  <button type="button" class="switcher-btn group" (click)="toggleDropdown($event)" [class.active]="isOpen">
    <div class="project-icon" [style.background-color]="currentProject?.color || '#3b82f6'">
      {{ currentProject?.name ? currentProject!.name.charAt(0).toUpperCase() : 'P' }}
    </div>
    <div class="project-info">
      <span class="project-name">{{ currentProject?.name || ('PROJECT_SWITCHER.SELECT_WORKSPACE' | translate) }}</span>
      <span class="workspace-label">{{ 'PROJECT_SWITCHER.WORKSPACE_LABEL' | translate }}</span>
    </div>
    <mat-icon fontSet="material-icons-outlined" class="switcher-arrow" [class.expanded]="isOpen">
      expand_more
    </mat-icon>
  </button>
  <div class="switcher-dropdown" *ngIf="isOpen" (click)="$event.stopPropagation()">
    <div class="dropdown-header">
      <span class="dropdown-title">{{ 'PROJECT_SWITCHER.PROJECTS_TITLE' | translate }}</span>
    </div>
    <div class="project-list custom-scrollbar">
      <button type="button" class="project-item" *ngFor="let p of projects" (click)="selectProject(p, $event)" [class.active]="p.id === currentProject?.id">
        <div class="project-icon-sm" [style.background-color]="p.color || '#3b82f6'">
          {{ p.name.charAt(0).toUpperCase() }}
        </div>
        <span class="project-name-sm">{{ p.name }}</span>
        <mat-icon *ngIf="p.id === currentProject?.id" fontSet="material-icons-outlined" class="check-icon">
          check
        </mat-icon>
      </button>
      <div *ngIf="projects.length === 0" class="empty-state">
        <span>{{ 'PROJECT_SWITCHER.NO_PROJECTS' | translate }}</span>
      </div>
    </div>
    <div class="dropdown-footer">
      <button type="button" class="create-btn" (click)="openCreateProject($event)">
        <mat-icon fontSet="material-icons-outlined" class="create-icon">add</mat-icon>
        <span>{{ 'PROJECT_SWITCHER.CREATE_PROJECT' | translate }}</span>
      </button>
    </div>
  </div>
</div>
