<section class="auth-callback-page" aria-live="polite" aria-labelledby="callback-status">

  <!-- Loading State -->
  <div *ngIf="status() === 'loading'" class="callback-state loading-state">
    <div class="spinner-ring" aria-hidden="true">
      <div class="ring"></div>
      <mat-icon class="spinner-icon">lock</mat-icon>
    </div>
    <h1 id="callback-status" class="state-title">Đang xác nhận tài khoản...</h1>
    <p class="state-subtitle">Vui lòng chờ trong giây lát</p>
  </div>

  <!-- Success State -->
  <div *ngIf="status() === 'success'" class="callback-state success-state">
    <figure class="success-icon" aria-hidden="true">
      <div class="check-circle">
        <mat-icon>check</mat-icon>
      </div>
      <div class="confetti-ring" aria-hidden="true"></div>
    </figure>

    <h1 id="callback-status" class="state-title">Tài khoản đã được kích hoạt! 🎉</h1>
    <p class="state-subtitle">
      Chào mừng bạn đến với <strong>AI Smart Kanban</strong>.<br>
      Bạn sẽ được chuyển vào ứng dụng sau <strong>{{ countdown() }}</strong> giây...
    </p>

    <progress
      class="redirect-progress"
      [value]="3 - countdown()"
      max="3"
      aria-label="Đếm ngược chuyển hướng"
    ></progress>
  </div>

  <!-- Error State -->
  <div *ngIf="status() === 'error'" class="callback-state error-state">
    <figure class="error-icon" aria-hidden="true">
      <div class="error-circle">
        <mat-icon>error_outline</mat-icon>
      </div>
    </figure>

    <h1 id="callback-status" class="state-title">Liên kết không hợp lệ</h1>
    <p class="state-subtitle">{{ errorMessage() }}</p>

    <nav class="error-actions" aria-label="Các lựa chọn tiếp theo">
      <a routerLink="/register" class="action-btn primary-btn">
        <mat-icon>person_add</mat-icon>
        Đăng ký lại
      </a>
      <a routerLink="/login" class="action-btn secondary-btn">
        <mat-icon>login</mat-icon>
        Đăng nhập
      </a>
    </nav>
  </div>

</section>
