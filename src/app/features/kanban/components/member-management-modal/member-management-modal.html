<div class="modal-overlay" (click)="close()"></div>
<div class="modal-container">
  <div class="modal-header">
    <h2 class="text-xl font-bold text-slate-800 m-0">Quản lý thành viên dự án</h2>
    <button class="close-btn" (click)="close()">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <div class="modal-body p-6 custom-scrollbar">
    <!-- Khu vực mời thành viên -->
    <div class="invite-section mb-8 bg-blue-50/50 p-4 rounded-lg border border-blue-100">
      <h3 class="text-sm font-semibold text-slate-700 mb-3 flex items-center gap-2">
        <mat-icon class="text-blue-500 text-[18px] w-[18px] h-[18px] leading-[18px]">person_add</mat-icon>
        Mời thành viên mới
      </h3>
      <form class="flex gap-2" (submit)="inviteMember(); $event.preventDefault()">
        <div class="flex-1">
          <input type="text" [(ngModel)]="inviteUserId" name="userId" placeholder="Nhập User ID (VD: user-2)"
            class="w-full h-10 px-3 rounded-md border border-slate-300 text-sm focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all">
        </div>
        <select [(ngModel)]="inviteRole" name="role"
          class="h-10 px-3 rounded-md border border-slate-300 text-sm bg-white focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500">
          <option value="admin">Quản trị viên (Admin)</option>
          <option value="member">Thành viên (Member)</option>
          <option value="viewer">Người xem (Viewer)</option>
        </select>
        <button type="submit" [disabled]="!inviteUserId.trim()"
          class="h-10 px-5 rounded-md bg-blue-600 text-white text-sm font-medium hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed transition-colors">
          Thêm
        </button>
      </form>
    </div>

    <!-- Danh sách thành viên -->
    <div class="members-section">
      <h3 class="text-sm font-semibold text-slate-700 mb-3 flex items-center gap-2">
        <mat-icon class="text-slate-500 text-[18px] w-[18px] h-[18px] leading-[18px]">groups</mat-icon>
        Thành viên hiện tại ({{ members.length }})
      </h3>
      
      <div *ngIf="isLoading" class="flex justify-center p-8 text-slate-400">
        <mat-icon class="animate-spin">autorenew</mat-icon>
      </div>

      <div *ngIf="!isLoading" class="members-list border border-slate-200 rounded-lg overflow-hidden">
        <div *ngFor="let member of members" 
             class="member-row flex items-center justify-between p-3 border-b border-slate-100 last:border-0 hover:bg-slate-50 transition-colors">
          
          <div class="flex items-center gap-3 flex-1 min-w-0">
            <div class="w-9 h-9 rounded-full bg-slate-200 flex items-center justify-center text-slate-500 font-medium text-sm shrink-0">
              {{ member.user_id.substring(0, 2).toUpperCase() }}
            </div>
            <div class="flex flex-col min-w-0">
              <span class="text-sm font-medium text-slate-800 truncate">{{ member.user_id }}</span>
              <span class="text-xs text-slate-500 truncate" *ngIf="member.job_role">{{ member.job_role }}</span>
            </div>
          </div>

          <div class="flex items-center gap-2 shrink-0">
            <!-- Dropdown chọn Role -->
            <select *ngIf="member.role !== 'owner'" 
                    [ngModel]="member.role" 
                    (ngModelChange)="changeRole(member, $event)"
                    class="h-8 px-2 rounded border border-slate-200 text-xs bg-white text-slate-700 focus:outline-none focus:border-blue-500">
              <option value="admin">Admin</option>
              <option value="member">Member</option>
              <option value="viewer">Viewer</option>
            </select>
            
            <span *ngIf="member.role === 'owner'" class="px-3 py-1 rounded bg-amber-100 text-amber-700 text-xs font-bold whitespace-nowrap">
              Owner
            </span>

            <button *ngIf="member.role !== 'owner'" 
                    (click)="removeMember(member)"
                    class="w-8 h-8 rounded flex items-center justify-center text-slate-400 hover:text-red-500 hover:bg-red-50 transition-colors"
                    title="Xóa thành viên">
              <mat-icon class="text-[18px] w-[18px] h-[18px] leading-[18px]">person_remove</mat-icon>
            </button>
            <div *ngIf="member.role === 'owner'" class="w-8"></div>
          </div>
          
        </div>
      </div>
    </div>
  </div>
</div>
