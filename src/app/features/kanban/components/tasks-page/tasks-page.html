<main class="tasks-page" role="main">

  <app-loading-spinner *ngIf="!taskStore.isProjectsInitialized() || taskStore.projectsLoading() || taskStore.loading()" />

  <ng-container *ngIf="taskStore.isProjectsInitialized() && !taskStore.projectsLoading() && !taskStore.loading()">
    <app-page-toolbar 
      [pageTitle]="pageTitle" 
      [canCreate]="taskStore.projects().length === 0 || permissionService.can('task.create')"
    />

    <app-view-filter-bar
      [viewTabs]="viewTabs"
      [quickFilters]="quickFilters"
      [activeView]="activeView"
      (viewChange)="onViewChange($event)" />

    <app-data-table
      *ngIf="activeView === 'list'"
      [data]="tasks"
      (itemSelected)="openTaskDetail($event)">
      
      <div emptyState *ngIf="taskStore.projects().length === 0 || tasks.length === 0" class="flex-1 bg-transparent flex flex-col items-center justify-center pointer-events-none pb-[15vh] pt-[15vh]">
          <div class="text-center text-slate-600 drop-shadow-sm flex flex-col gap-2">
              <h2 class="text-[26px] font-light tracking-wide">Tạo một tác vụ</h2>
              <p class="text-[13px] font-normal text-slate-500 max-w-sm mx-auto leading-relaxed">
                  Chế độ xem này sẽ hiển thị các tác vụ mà bạn và/hoặc nhân viên của bạn có trách nhiệm thực hiện.
              </p>
          </div>
      </div>

    </app-data-table>

    <app-deadline *ngIf="activeView === 'deadline'" (taskSelected)="openTaskDetail($event)" />

    <app-task-detail-modal
      *ngIf="selectedTask || taskStore.selectedTask()"
      [task]="selectedTask || taskStore.selectedTask()"
      (close)="closeTaskDetail()">
    </app-task-detail-modal>
  </ng-container>

</main>
