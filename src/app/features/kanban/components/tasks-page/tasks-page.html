<div class="tasks-page">

  <!-- Toolbar: Tiêu đề + Tạo + Bộ lọc + Tìm kiếm -->
  <app-tasks-toolbar />

  <!-- Filter Bar: Chế độ xem + Quick Filters + Actions -->
  <app-tasks-filter-bar (viewChange)="onViewChange($event)" />

  <!-- View: Danh sách -->
  <app-tasks-table *ngIf="activeView === 'list'" [tasks]="tasks" />

  <!-- View: Hạn chót -->
  <app-deadline *ngIf="activeView === 'deadline'" (taskSelected)="openTaskDetail($event)" />

  <!-- Task Detail Modal Overlay -->
  <app-task-detail-modal 
    *ngIf="selectedTask" 
    [task]="selectedTask" 
    (close)="closeTaskDetail()">
  </app-task-detail-modal>

</div>
