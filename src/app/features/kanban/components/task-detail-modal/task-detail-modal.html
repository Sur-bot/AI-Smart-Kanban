<div class="modal-overlay"
     [class.opacity-0]="isClosing"
     [class.opacity-100]="!isClosing"
     (click)="triggerClose()"
     aria-hidden="true"></div>

<section class="modal-frame"
     [class.slide-up]="!isClosing"
     [class.slide-down]="isClosing"
     role="dialog"
     [attr.aria-label]="task?.title || ('TASK_DETAIL.TITLE' | translate)"
     aria-modal="true">
  
  <nav class="modal-actions-sidebar" aria-label="Thao tác điều khiển hộp thoại">
    <button type="button" class="modal-close-btn" (click)="triggerClose()"
            matTooltip="Đóng" matTooltipPosition="left"
            [attr.aria-label]="'TASK_DETAIL.CLOSE' | translate">
      <mat-icon>close</mat-icon>
    </button>
    <button type="button" class="modal-action-btn"
            matTooltip="Sao chép liên kết" matTooltipPosition="left"
            [attr.aria-label]="'TASK_DETAIL.COPY_LINK' | translate">
      <mat-icon>link</mat-icon>
    </button>
    <button type="button" class="modal-action-btn" (click)="toggleFullscreen()"
            [matTooltip]="isFullscreen ? 'Thu nhỏ' : 'Toàn màn hình'" matTooltipPosition="left"
            [attr.aria-label]="(isFullscreen ? 'TASK_DETAIL.MINIMIZE' : 'TASK_DETAIL.EXPAND') | translate">
      <mat-icon>{{ isFullscreen ? 'fullscreen_exit' : 'fullscreen' }}</mat-icon>
    </button>
    <button type="button" class="modal-action-btn"
            matTooltip="In tác vụ" matTooltipPosition="left"
            [attr.aria-label]="'TASK_DETAIL.PRINT' | translate">
      <mat-icon>print</mat-icon>
    </button>
  </nav>

  <article class="modal-container" [class.fullscreen-mode]="isFullscreen">
    
    <section class="left-pane flex flex-col bg-white" [style.width.%]="LEFT_PANE_WIDTH" aria-label="Danh sách tác vụ trong dự án">
      <app-task-list-panel
        [activeTaskId]="task?.id ?? null"
        (taskSelected)="onTaskSelected($event)"
        class="flex flex-col h-full w-full overflow-hidden"
      ></app-task-list-panel>
    </section>

    <!-- Right Pane: Comments -->
    <aside class="right-pane bg-slate-50 flex flex-col border-l border-slate-200" [style.width.%]="100 - LEFT_PANE_WIDTH" aria-label="Thảo luận và tiến trình tác vụ">
      <app-task-comments 
        *ngIf="task" 
        [task]="task"
        (changesMade)="markAsDirty()"
        class="flex flex-col h-full w-full">
      </app-task-comments>
    </aside>
  </article>
</section>
