<div class="task-subtasks-wrapper">
  <!-- Tiêu đề & Nút thêm -->
  <header class="flex items-center justify-between mb-4 mt-2 px-1">
    <div class="flex items-center gap-2.5">
      <div class="flex items-center justify-center w-8 h-8 rounded-lg bg-indigo-50 text-indigo-600 shadow-inner">
        <mat-icon class="text-[20px] w-5 h-5 leading-5">checklist</mat-icon>
      </div>
      <h3 class="text-sm font-bold text-slate-800 m-0 tracking-tight">{{ 'TASK_DETAIL.CHIPS.SUBTASKS' | translate }}</h3>
      <span class="px-2 py-0.5 rounded-full bg-slate-100 text-slate-500 text-[11px] font-semibold">{{ completedCount }}/{{ subtasks.length }}</span>
    </div>
    
    <button *ngIf="!isAdding" 
            type="button" 
            class="group flex items-center gap-1.5 text-indigo-600 hover:text-indigo-700 bg-indigo-50/50 hover:bg-indigo-100 px-3 py-1.5 rounded-lg text-xs font-semibold transition-all duration-200"
            (click)="showAddForm()">
      <mat-icon class="text-[16px] w-4 h-4 leading-4 group-hover:scale-110 transition-transform">add</mat-icon>
      Thêm
    </button>
  </header>

  <!-- Progress Bar (Premium) -->
  <div class="progress-section mb-6 px-1" *ngIf="subtasks.length > 0">
    <div class="flex items-center justify-between mb-1.5">
      <span class="text-[11px] font-medium text-slate-500">Tiến độ hoàn thành</span>
      <span class="text-[11px] font-bold" [ngClass]="progressPercentage === 100 ? 'text-emerald-500' : 'text-indigo-600'">
        {{ progressPercentage }}%
      </span>
    </div>
    <div class="w-full bg-slate-100 h-2 rounded-full overflow-hidden shadow-inner">
      <div class="h-full transition-all duration-500 ease-out rounded-full" 
           [ngClass]="progressPercentage === 100 ? 'bg-gradient-to-r from-emerald-400 to-emerald-500' : 'bg-gradient-to-r from-indigo-500 to-blue-500'"
           [style.width.%]="progressPercentage">
      </div>
    </div>
  </div>

  <!-- Danh sách Subtasks -->
  <ul class="subtasks-list m-0 p-0 list-none flex flex-col gap-2.5">
    <li *ngFor="let subtask of subtasks" 
        class="subtask-item group relative flex items-start gap-3 p-3 rounded-xl bg-white border border-slate-200 shadow-sm hover:shadow-md hover:border-indigo-200 transition-all duration-200 cursor-pointer overflow-hidden"
        (click)="openSubtask(subtask.id)">
      
      <!-- Hover Indicator (Trang trí sọc bên trái khi hover) -->
      <div class="absolute left-0 top-0 bottom-0 w-1 bg-indigo-500 opacity-0 group-hover:opacity-100 transition-opacity"></div>

      <!-- Checkbox (Tròn, hiện đại) -->
      <button type="button" 
              class="relative w-5 h-5 mt-0.5 rounded-full flex items-center justify-center transition-all duration-300 focus:outline-none shrink-0"
              [ngClass]="subtask.completed_at ? 'bg-gradient-to-br from-indigo-500 to-blue-600 border-none shadow-inner' : 'bg-white border-2 border-slate-300 hover:border-indigo-400'"
              (click)="toggleSubtask(subtask, $event)">
        <mat-icon *ngIf="subtask.completed_at" class="text-white text-[14px] w-3.5 h-3.5 leading-[14px] font-black scale-100 animate-in zoom-in duration-200">check</mat-icon>
      </button>

      <!-- Tiêu đề Subtask -->
      <div class="flex-1 min-w-0 flex flex-col justify-center">
        <p class="text-[13px] m-0 truncate transition-all duration-300"
           [ngClass]="subtask.completed_at ? 'line-through text-slate-400' : 'text-slate-700 font-medium group-hover:text-indigo-900'">
          {{ subtask.title }}
        </p>
      </div>

      <!-- Actions: Mở & Xóa -->
      <div class="flex items-center gap-1 opacity-0 group-hover:opacity-100 transition-opacity">
        <button type="button" 
                class="w-7 h-7 flex items-center justify-center text-slate-400 hover:text-indigo-600 hover:bg-indigo-50 rounded-lg transition-colors focus:outline-none"
                matTooltip="Mở chi tiết">
          <mat-icon class="text-[16px] w-4 h-4 leading-4">open_in_new</mat-icon>
        </button>
        <button type="button" 
                class="w-7 h-7 flex items-center justify-center text-slate-400 hover:text-rose-500 hover:bg-rose-50 rounded-lg transition-colors focus:outline-none"
                matTooltip="Xóa"
                (click)="deleteSubtask(subtask.id, $event)">
          <mat-icon class="text-[16px] w-4 h-4 leading-4">delete_outline</mat-icon>
        </button>
      </div>
    </li>
  </ul>

  <!-- Form thêm mới (Smooth UI) -->
  <div *ngIf="isAdding" class="mt-3 p-1 animate-in fade-in slide-in-from-top-2 duration-200">
    <div class="flex items-center bg-white border border-indigo-200 shadow-sm shadow-indigo-500/10 rounded-xl overflow-hidden focus-within:ring-2 focus-within:ring-indigo-500/20 transition-all">
      <div class="pl-3 pr-2 flex items-center text-indigo-400">
        <mat-icon class="text-[18px] w-[18px] h-[18px] leading-[18px]">add_task</mat-icon>
      </div>
      <input type="text" 
             [(ngModel)]="newSubtaskTitle" 
             (keydown.enter)="addSubtask()"
             (keydown.escape)="cancelAdd()"
             class="flex-1 bg-transparent py-2.5 text-[13px] text-slate-700 outline-none placeholder:text-slate-400"
             placeholder="Nhập tên việc con và nhấn Enter..." 
             autofocus>
      
      <div class="flex items-center gap-1 pr-2">
        <button type="button" 
                class="text-[11px] font-bold text-slate-500 hover:text-slate-700 bg-slate-100 hover:bg-slate-200 px-2 py-1 rounded transition-colors" 
                (click)="cancelAdd()">ESC</button>
        <button type="button" 
                class="text-[11px] font-bold text-white bg-indigo-600 hover:bg-indigo-700 px-2.5 py-1 rounded shadow-sm transition-colors disabled:opacity-50" 
                [disabled]="!newSubtaskTitle.trim()"
                (click)="addSubtask()">ENTER</button>
      </div>
    </div>
  </div>
</div>
