<article class="task-card-container" [attr.aria-label]="task.title">
  <div class="card-stripe" [ngClass]="task.stripeColor" aria-hidden="true"></div>
  
  <div class="card-content">
    <header class="card-header">
      <h3 class="task-title">{{ task.title }}</h3>
      <span class="task-badge bg-orange-500" *ngIf="task.badgeCount" [attr.aria-label]="task.badgeCount + ' thông báo'">
        {{ task.badgeCount }}
      </span>
    </header>
    
    <div class="task-meta" *ngIf="task.timeLabel">
      <time class="time-label" [ngClass]="task.timeColor ? 'time-' + task.timeColor : 'time-default'">
        {{ task.timeLabel }}
      </time>
    </div>
    
    <footer class="card-footer">
      <div class="task-assignees" *ngIf="task.assignees && task.assignees.length > 0">
        <ng-container *ngFor="let assignee of task.assignees; let i = index">
          <figure class="avatar bg-slate-400" [title]="assignee.name || 'Thành viên'">
            <mat-icon class="text-white">person</mat-icon>
          </figure>
          <mat-icon *ngIf="i < task.assignees.length - 1" class="separator" aria-hidden="true">chevron_right</mat-icon>
        </ng-container>
      </div>

      <div *ngIf="!task.assignees || task.assignees.length === 0" class="flex-1"></div>

      <div class="task-actions" role="group" aria-label="Thao tác nhanh trên tác vụ">
        <button type="button" class="action-btn bg-slate-500 hover:bg-slate-600" title="Tắt tiếng" aria-label="Tắt tiếng tác vụ">
          <mat-icon>notifications_off</mat-icon>
        </button>
        <button type="button" class="action-btn bg-sky-400 hover:bg-sky-500" title="Bắt đầu tác vụ" aria-label="Bắt đầu tác vụ">
          <mat-icon>play_arrow</mat-icon>
        </button>
        <button type="button" class="action-btn bg-slate-300 hover:bg-slate-400" title="Hoàn tất tác vụ" aria-label="Hoàn tất tác vụ">
          <mat-icon>flag</mat-icon>
        </button>
      </div>
    </footer>
  </div>
</article>
