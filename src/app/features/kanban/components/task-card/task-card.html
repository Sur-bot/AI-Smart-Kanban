<article class="task-card-container" [attr.aria-label]="task.title" (click)="onCardClick()">
  <!-- Stripe màu theo deadline / status -->
  <div class="card-stripe" [ngClass]="task.stripeColor" aria-hidden="true"></div>

  <div class="card-content">

    <!-- ── Header: Type icon + Title + Priority ── -->
    <header class="card-header">
      <div class="task-title-group">
        <mat-icon class="type-icon" [fontSet]="'material-icons-outlined'" [title]="task.taskType">
          {{ taskTypeIcon }}
        </mat-icon>
        <h3 class="task-title">{{ task.title }}</h3>
      </div>
      <span *ngIf="task.priority && task.priority !== 'none'"
            class="priority-badge"
            [ngClass]="'priority-' + task.priority"
            [attr.aria-label]="'Độ ưu tiên: ' + task.priority">
        {{ priorityLabel }}
      </span>
    </header>

    <!-- ── Labels ── -->
    <div class="label-row" *ngIf="visibleLabels.length > 0" role="list" aria-label="Nhãn tác vụ">
      <span *ngFor="let label of visibleLabels"
            class="label-chip"
            [style.background-color]="label.color + '26'"
            [style.color]="label.color"
            [style.border-color]="label.color + '66'"
            role="listitem">
        {{ label.name }}
      </span>
      <span *ngIf="extraLabelCount > 0" class="label-chip label-chip--more">
        +{{ extraLabelCount }}
      </span>
    </div>

    <!-- ── Footer: Avatars + Counters + Due Date ── -->
    <footer class="card-footer">

      <!-- Avatar stack -->
      <div class="assignee-stack" *ngIf="task.assignees && task.assignees.length > 0"
           role="group" [attr.aria-label]="task.assignees.length + ' người được giao'">
        <figure *ngFor="let a of visibleAssignees; let i = index"
                class="avatar"
                [title]="a.name"
                [style.z-index]="10 - i">
          <img *ngIf="a.avatar_url" [src]="a.avatar_url" [alt]="a.name" class="avatar-img" />
          <span *ngIf="!a.avatar_url" class="avatar-initials">{{ a.name | slice:0:1 }}</span>
        </figure>
        <figure *ngIf="extraAssigneeCount > 0" class="avatar avatar--more" title="Và thêm {{ extraAssigneeCount }} người nữa">
          <span class="avatar-initials">+{{ extraAssigneeCount }}</span>
        </figure>
      </div>

      <div *ngIf="!task.assignees || task.assignees.length === 0" class="flex-1"></div>

      <!-- Counters: Checklist + Comment -->
      <div class="counter-group" role="group" aria-label="Thống kê tác vụ">
        <span *ngIf="task.checklistCount > 0"
              class="counter"
              [class.counter--done]="task.checklistDoneCount === task.checklistCount"
              [attr.aria-label]="task.checklistDoneCount + ' / ' + task.checklistCount + ' checklist'">
          <mat-icon class="counter-icon" fontSet="material-icons-outlined">check_box</mat-icon>
          {{ task.checklistDoneCount }}/{{ task.checklistCount }}
        </span>
        <span *ngIf="task.commentCount > 0"
              class="counter"
              [attr.aria-label]="task.commentCount + ' bình luận'">
          <mat-icon class="counter-icon" fontSet="material-icons-outlined">chat_bubble</mat-icon>
          {{ task.commentCount }}
        </span>
        <time *ngIf="task.dueDate"
              class="due-date"
              [class.due-date--overdue]="isOverdue"
              [class.due-date--today]="isDueToday"
              [attr.datetime]="task.dueDate"
              [title]="task.dueDate | date:'dd/MM/yyyy'">
          <mat-icon class="counter-icon">event</mat-icon>
          {{ task.dueDate | date:'dd/MM' }}
        </time>
      </div>

    </footer>

    <!-- ── Hover Actions ── -->
    <div class="hover-actions" role="group" aria-label="Thao tác nhanh">
      <button type="button" class="action-btn action-btn--mute"
              title="Tắt tiếng thông báo"
              aria-label="Tắt tiếng tác vụ"
              (click)="onMute($event)">
        <mat-icon fontSet="material-icons-outlined">notifications_off</mat-icon>
      </button>
      <ng-container *ngIf="permissionService.can('task.update')">
        <button type="button" class="action-btn action-btn--start"
                *ngIf="!isStarted"
                title="Bắt đầu tác vụ"
                aria-label="Bắt đầu tác vụ"
                (click)="onStart($event)">
          <mat-icon>play_arrow</mat-icon>
        </button>
        <button type="button" class="action-btn action-btn--done"
                title="Hoàn tất tác vụ"
                aria-label="Hoàn tất tác vụ"
                (click)="onComplete($event)">
          <mat-icon fontSet="material-icons-outlined">task_alt</mat-icon>
        </button>
      </ng-container>
    </div>

  </div>
</article>
