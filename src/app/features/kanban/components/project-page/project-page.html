<section class="project-page" aria-label="Trang quản lý dự án">

  <app-page-toolbar
    pageTitle="Dự án"
    searchContext="project"
    [availableFields]="projectFields"
    [showRoleDropdown]="false"
    [showCreateDropdown]="false"
    [showToolbarRight]="false"
  />

  <app-view-filter-bar
    [quickFilters]="quickFilters"
    [activeView]="activeView"
    [showMarkRead]="false"
    (viewChange)="onViewChange($event)"
  />

  <main class="project-content">
    <!-- Trạng thái 1: Đang tải khởi tạo -->
    <app-loading-spinner *ngIf="!taskStore.isProjectsInitialized() || taskStore.projectsLoading()" />

    <!-- Trạng thái 2: Hiển thị bảng danh sách dự án hoàn chỉnh -->
    <app-project-data-table
      *ngIf="taskStore.isProjectsInitialized() && !taskStore.projectsLoading()"
      [projects]="taskStore.projects()"
      [currentUserId]="currentUserId"
      (projectSelected)="onProjectSelect($event)"
      (memberManage)="openMemberModal($event)"
      (projectEdit)="openEditProject($event)"
      (batchAction)="onBatchAction($event)"
    />
  </main>

</section>
