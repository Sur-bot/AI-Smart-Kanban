<!-- ──── Tech Stack Section ──── -->
<section id="tech" class="tech-section">
  <div class="tech-container">
    <header class="tech-header">
      <h2 class="tech-subtitle">{{ 'LANDING_TECH.SUBTITLE' | translate }}</h2>
      <p class="tech-title">{{ 'LANDING_TECH.TITLE' | translate }}</p>
    </header>

    <ul class="tech-grid">
      @for (tech of technologies; track tech.name) {
        <li class="tech-card" [class]="tech.colSpanClass || ''">
          <figure class="tech-icon-wrapper m-0" [class]="tech.bgClass">
            <img
              [src]="tech.iconPath"
              [alt]="tech.altText"
              width="32"
              height="32"
              loading="lazy"
              decoding="async"
              class="tech-icon"
              (error)="handleImageError($event)"
            />
          </figure>
          <span class="tech-name">{{ tech.name }}</span>
        </li>
      }
    </ul>
  </div>
</section>
