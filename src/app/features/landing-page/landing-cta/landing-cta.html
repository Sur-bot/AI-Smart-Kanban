<section
  class="cta-section"
  aria-labelledby="cta-heading"
  itemscope
  itemtype="https://schema.org/WebPageElement"
>
  <meta itemprop="name" content="Digit24" />

  <figure class="cta-bg-wrapper" aria-hidden="true">
    <span class="cta-bg-circle-1"></span>
    <span class="cta-bg-circle-2"></span>
  </figure>

  <article class="cta-content-wrapper">
    <header>
      <h2 id="cta-heading" class="cta-title" itemprop="headline">
        {{ 'LANDING_CTA.TITLE_1' | translate }} <br class="hidden sm:block" />
        {{ 'LANDING_CTA.TITLE_2' | translate }}
      </h2>
      <p class="cta-description" itemprop="description">
        {{ 'LANDING_CTA.DESCRIPTION' | translate }}
      </p>
    </header>
    <nav aria-label="Hành động đăng ký Digit24">
      <a
        routerLink="/register"
        class="cta-button"
        [title]="'LANDING_CTA.BUTTON_TITLE' | translate"
        [attr.aria-label]="'LANDING_CTA.BUTTON_TITLE' | translate"
        itemprop="url"
      >
        <span>{{ 'LANDING_CTA.BUTTON' | translate }}</span>
        <mat-icon fontSet="material-icons-outlined" aria-hidden="true">arrow_forward</mat-icon>
      </a>
    </nav>
  </article>
</section>
