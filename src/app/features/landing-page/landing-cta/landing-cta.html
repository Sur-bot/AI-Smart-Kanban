<!-- ──── Final CTA Section ──── -->
<section class="cta-section">
  <div class="cta-bg-wrapper" aria-hidden="true">
    <div class="cta-bg-circle-1"></div>
    <div class="cta-bg-circle-2"></div>
  </div>

  <div class="cta-content-wrapper">
    <h2 class="cta-title">
      {{ 'LANDING_CTA.TITLE_1' | translate }} <br class="hidden sm:block"/>
      {{ 'LANDING_CTA.TITLE_2' | translate }}
    </h2>
    <p class="cta-description">
      {{ 'LANDING_CTA.DESCRIPTION' | translate }}
    </p>
    <a routerLink="/register" class="cta-button" [title]="'LANDING_CTA.BUTTON_TITLE' | translate">
      {{ 'LANDING_CTA.BUTTON' | translate }}
      <mat-icon fontSet="material-icons-outlined">arrow_forward</mat-icon>
    </a>
  </div>
</section>
