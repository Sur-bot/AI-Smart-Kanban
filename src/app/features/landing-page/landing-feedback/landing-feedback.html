<!-- ──── Fixed Feedback Button + Panel ──── -->
<aside class="fixed bottom-10 right-8 z-[100]" aria-label="Khung phản hồi">

  <!-- Feedback Panel (slide-up) -->
  @if (feedbackOpen()) {
    <!-- Backdrop mờ trên mobile -->
    <div class="fixed inset-0 bg-black/30 backdrop-blur-sm sm:hidden z-[99]" (click)="closeFeedback()"></div>

    <div class="feedback-panel absolute bottom-16 right-0 w-[340px] sm:w-[380px] bg-white rounded-2xl shadow-2xl border border-slate-200 overflow-hidden z-[101]">
      <!-- Header -->
      <header class="bg-gradient-to-r from-blue-600 to-cyan-500 px-6 py-5 text-white relative">
        <button type="button" class="absolute top-3 right-3 w-8 h-8 rounded-full bg-white/20 hover:bg-white/30 flex items-center justify-center transition-colors" (click)="closeFeedback()" aria-label="Đóng khung phản hồi">
          <mat-icon class="text-[20px] w-5 h-5 flex items-center justify-center leading-none">close</mat-icon>
        </button>
        <h3 class="text-lg font-bold leading-snug">Hãy cho chúng tôi biết<br/>ý kiến của bạn</h3>
        <p class="text-blue-100 text-sm mt-1">Mọi phản hồi đều rất quý giá!</p>
      </header>

      <!-- Form -->
      <form class="px-6 py-5 space-y-4" (submit)="$event.preventDefault()">
        <!-- Email -->
        <fieldset class="space-y-1.5">
          <label for="fb-email" class="text-sm font-semibold text-slate-700">
            Email của bạn <span class="text-red-500">*</span>
          </label>
          <input id="fb-email" type="email" required placeholder="email@example.com" class="w-full px-4 py-2.5 rounded-lg border border-slate-300 bg-slate-50 text-sm text-slate-800 placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500/40 focus:border-blue-500 transition-all"/>
        </fieldset>

        <!-- Loại phản hồi (Custom Dropdown) -->
        <fieldset class="space-y-1.5 relative">
          <label id="fb-type-label" class="text-sm font-semibold text-slate-700">Loại phản hồi</label>
          
          <!-- Nút chọn hiển thị giá trị hiện tại -->
          <button type="button" 
                  (click)="toggleTypeDropdown()" 
                  class="w-full px-4 py-2.5 flex items-center justify-between rounded-lg border border-slate-300 bg-slate-50 text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-500/40 focus:border-blue-500 transition-all"
                  aria-labelledby="fb-type-label">
            <span class="flex items-center gap-2">
              <mat-icon class="text-[18px] w-[18px] h-[18px] text-blue-600">{{ selectedFeedbackType().icon }}</mat-icon>
              {{ selectedFeedbackType().label }}
            </span>
            <mat-icon class="text-[20px] w-5 h-5 text-slate-400 transition-transform duration-200" [class.rotate-180]="isTypeDropdownOpen()">keyboard_arrow_down</mat-icon>
          </button>

          <!-- Danh sách menu thả xuống -->
          @if (isTypeDropdownOpen()) {
            <!-- Màn chắn trong suốt để đóng menu khi click ra ngoài -->
            <div class="fixed inset-0 z-40" (click)="isTypeDropdownOpen.set(false)"></div>
            
            <ul class="absolute top-full left-0 right-0 mt-2 z-50 bg-white border border-slate-200 rounded-lg shadow-xl overflow-hidden py-1">
              @for (type of feedbackTypes; track type.value) {
                <li>
                  <button type="button" 
                          (click)="selectFeedbackType(type)"
                          class="w-full px-4 py-2 flex items-center gap-3 text-sm text-slate-700 hover:bg-slate-100 transition-colors text-left">
                    <mat-icon class="text-[18px] w-[18px] h-[18px] text-slate-400" [class.text-blue-600]="selectedFeedbackType().value === type.value">{{ type.icon }}</mat-icon>
                    <span [class.font-semibold]="selectedFeedbackType().value === type.value">{{ type.label }}</span>
                  </button>
                </li>
              }
            </ul>
          }
        </fieldset>

        <!-- Nội dung nhận xét -->
        <fieldset class="space-y-1.5">
          <label for="fb-message" class="text-sm font-semibold text-slate-700">
            Nội dung nhận xét <span class="text-red-500">*</span>
          </label>
          <textarea id="fb-message" rows="4" required placeholder="Chia sẻ trải nghiệm hoặc đề xuất của bạn..." class="w-full px-4 py-2.5 rounded-lg border border-slate-300 bg-slate-50 text-sm text-slate-800 placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500/40 focus:border-blue-500 transition-all resize-none"></textarea>
        </fieldset>

        <!-- Submit -->
        <button type="submit" class="w-full py-3 rounded-lg bg-gradient-to-r from-blue-600 to-cyan-500 text-white font-bold text-sm hover:shadow-lg hover:shadow-blue-500/25 hover:-translate-y-0.5 transition-all duration-300 active:translate-y-0 flex items-center justify-center gap-2">
          <mat-icon class="text-[18px] w-[18px] h-[18px]">send</mat-icon>
          Gửi phản hồi
        </button>
      </form>
    </div>
  }

  <!-- Toggle Button -->
  <button type="button" class="relative group flex items-center justify-center w-12 h-12" (click)="toggleFeedback()" [attr.aria-expanded]="feedbackOpen()" aria-label="Phản hồi / Hỗ trợ">
    <!-- Outer pulsing ring (ẩn khi mở panel) -->
    @if (!feedbackOpen()) {
      <span class="absolute inset-0 rounded-full bg-[#00a3e8] opacity-30 animate-ping transition-opacity duration-300" style="animation-duration: 2s;"></span>
      <span class="absolute inset-[-5px] rounded-full border border-[#00a3e8]/30 bg-[#00a3e8]/10"></span>
      <span class="absolute inset-[-10px] rounded-full border border-[#00a3e8]/20 bg-[#00a3e8]/5"></span>
    }
    <!-- Button core -->
    <span class="relative w-full h-full rounded-full bg-[#00a3e8] text-white flex items-center justify-center shadow-lg shadow-[#00a3e8]/40 transition-all duration-300">
      <mat-icon class="text-[24px] w-6 h-6 transition-transform duration-300" [class.rotate-90]="feedbackOpen()">
        {{ feedbackOpen() ? 'close' : 'receipt_long' }}
      </mat-icon>
    </span>
  </button>
</aside>
