@if (images.length === 0) {
  <section class="empty-state" role="status">
    <mat-icon class="!text-[48px] !w-12 !h-12 !leading-[48px] text-gray-300">photo_library</mat-icon>
    <h3 class="text-base font-medium text-gray-400 mt-3">Chưa có ảnh nào</h3>
    <p class="text-sm text-gray-400 mt-1">Tải ảnh lên để bắt đầu lưu trữ</p>
  </section>
} @else {
  <section class="image-grid" role="list" aria-label="Danh sách ảnh">
    @for (group of groupedImages; track group.label) {
      <div class="col-span-full group-header flex items-center justify-between py-2 border-b border-gray-100">
        <h3 class="text-sm font-semibold text-gray-700">{{ group.label }}</h3>
        <span class="text-xs text-gray-400 bg-gray-50 px-2 py-0.5 rounded-full">{{ group.images.length }} ảnh</span>
      </div>
      @for (image of group.images; track image.id) {
        <article class="image-card group" role="listitem" (click)="onImageClick(image)">
          <!-- Thumbnail -->
          <figure class="card-thumbnail">
            <img [src]="image.thumbnailUrl" [alt]="image.name" loading="lazy" />
            <!-- Hover Overlay -->
            <figcaption class="card-overlay">
              <button type="button" class="overlay-btn !bg-white hover:!bg-gray-100" title="Xóa ảnh" (click)="onDeleteClick($event, image)">
                <mat-icon class="!text-[22px] !w-[22px] !h-[22px] !leading-[22px] text-black">delete_outline</mat-icon>
              </button>
            </figcaption>
          </figure>
        </article>
      }
    }
  </section>
}
