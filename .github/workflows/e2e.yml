name: 🧪 E2E Tests (Playwright)

on:
  push:
  pull_request:

jobs:
  e2e:
    name: Playwright E2E — Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ─── 1. Checkout code ─────────────────────────────────────────────────
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      # ─── 2. Setup Node.js ─────────────────────────────────────────────────
      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ─── 3. Cài dependencies ──────────────────────────────────────────────
      - name: 📦 Install dependencies
        run: npm ci

      # ─── 4. Cài Playwright Chromium ───────────────────────────────────────
      - name: 🎭 Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      # ─── 5. Build Angular app ─────────────────────────────────────────────
      - name: 🏗️ Build Angular App
        run: npm run build -- --configuration production
        env:
          # Nếu dự án cần environment vars khi build
          NODE_ENV: production

      # ─── 6. Khởi động server tĩnh để serve dist ───────────────────────────
      - name: 🚀 Serve built app
        run: |
          npm install -g http-server
          http-server dist/ai-smart-kanban/browser -p 4200 --silent &
          echo "Server started on port 4200"
          # Chờ server sẵn sàng
          npx wait-on http://localhost:4200 --timeout 60000

      # ─── 7. Chạy Playwright tests ─────────────────────────────────────────
      - name: 🧪 Run Playwright E2E Tests
        run: npm run test:e2e:ci
        env:
          CI: true
          E2E_BASE_URL: http://localhost:4200
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}

      # ─── 8. Upload báo cáo HTML (luôn upload kể cả khi fail) ──────────────
      - name: 📊 Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ github.run_number }}
          path: playwright-report/
          retention-days: 30

      # ─── 9. Upload screenshots/videos khi fail ────────────────────────────
      - name: 🖼️ Upload test artifacts on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-failures-${{ github.run_number }}
          path: test-results/
          retention-days: 7
