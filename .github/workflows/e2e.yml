name: E2E Tests (Playwright)

on:
  push:
  pull_request:

jobs:
  e2e:
    name: Playwright E2E — Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
          cache: 'npm'

      - name: Cache Playwright Browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Build Angular App
        run: npm run build -- --configuration production
        env:
          NODE_ENV: production

      - name: Serve built app
        run: npm install -g http-server
          http-server dist/ai-smart-kanban/browser -p 4200 --silent &
          echo "Server started on port 4200"
          npx wait-on http://localhost:4200 --timeout 60000
      - name: Run Playwright E2E Tests
        run: npm run test:e2e:ci
        env:
          CI: true
          E2E_BASE_URL: http://localhost:4200
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ github.run_number }}
          path: playwright-report/
          retention-days: 30

      - name: Upload test artifacts on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-failures-${{ github.run_number }}
          path: test-results/
          retention-days: 7
