name: CI Quality Gate

on:
  pull_request:
    branches:
      - main
      - development
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-and-test:
    name: Security, TypeCheck, Unit Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
      APP_ENV: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
      API_URL: ${{ secrets.API_URL || 'http://localhost:3000/api' }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://placeholder.supabase.co' }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'placeholder-anon-key' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Security & TypeScript Health Check
        run: npm run verify:health

      - name: Run Unit Tests (Vitest)
        run: npm test -- --watch=false

      - name: Verify Production Bundle Build
        run: npm run build
